ShortDescription: "Draw on your PC screen from a phone or tablet, or use the phone as the PC's mouse. Nothing to install on the phone."
Description: |-
  Screen Markup is a Windows program and a web page that work as a pair. The program shows a short code; type it on your phone or tablet and you can draw over everything on the PC screen with a pen, highlighter, shapes, arrows and text, or use your finger as the PC's mouse. A live picture of the screen is sent to the device so you can point at what you mean. Nothing is installed on the phone, it works on any network, and nothing you draw is saved.

  Free for 7 days from the first run; a licence is needed after that. Windows 10 and 11, 64-bit. It installs for the current user only, without administrator rights.
