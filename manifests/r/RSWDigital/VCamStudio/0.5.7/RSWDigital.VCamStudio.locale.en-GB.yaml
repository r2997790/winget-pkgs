ShortDescription: "Virtual camera for Windows 11: turn your webcam, screen and slides into live scenes for Zoom, Teams and Meet."
Description: |-
  VCam Studio adds a virtual camera to Windows 11 and lets you build live scenes from your webcam, your screen, slides, pictures and overlays, then show them in Zoom, Teams, Meet or any other app that can use a camera. It can blur your background, add lower thirds and music, be driven from a phone, a Stream Deck, a command line (vcam) or an AI assistant, and carries its own guide.

  Free to try for 20 hours of use; a licence key is needed after that. Windows 11 (build 22000 or newer), 64-bit Intel or AMD. Windows asks for administrator approval once, to register the camera.
